[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aas-model"
version = "0.2.0"
description = "Shared AAS data-model package (ADR-016): base models (vendored aas_pydantic) + generated IDTA templates + project submodel templates + resource/instantiation templates + build/schema helpers + AAS-JSON<->model (de)serialization. Used by Python authoring and the registration service; managed DMP repository parsing is implemented in Java."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "basyx-python-sdk>=2.0.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
